plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

base {
    archivesName = project.archives_base_name
}

group = project.maven_group
version = project.mod_version

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "JUnit"
                url = "https://repo.maven.apache.org/maven2/"
            }
        }
        filter {
            includeGroupByRegex("org\\.junit(\\..*)?")
            includeGroup("org.apiguardian")
            includeGroup("org.opentest4j")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Nucleoid"
                url = "https://maven.nucleoid.xyz/"
            }
        }
        filter {
            includeGroup("eu.pb4")
        }
    }
}

configurations {
    unitTestRuntime
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "socialcore-gt" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "eu.pb4:polymer-core:${project.polymer_version}"
    implementation include("eu.pb4:sgui:${project.sgui_version}")

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    unitTestRuntime platform("org.junit:junit-bom:5.13.4")
    unitTestRuntime "org.junit.jupiter:junit-jupiter"
    unitTestRuntime "org.junit.platform:junit-platform-launcher"
}

tasks.test {
    useJUnitPlatform()
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.unitTestRuntime
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
